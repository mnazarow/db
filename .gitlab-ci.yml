# Проверки портала в GitLab CI: синтаксис конфигурации и шаблонов, соответствие миграций схеме,
# автотесты PHPUnit на MariaDB и MySQL 8.4 (PHP 8.2 и 8.5), проба Symfony 8, раздел «Видео» (Node.js, тесты связки с порталом на PostgreSQL),
# известные уязвимости в зависимостях (composer audit, npm audit) и проверка скриптов развёртывания shellcheck. По тегу vX.Y.Z — архив дистрибутива (с .sha256 и latest.txt для
# автоматического обновления серверов: docportal auto-update on --url <адрес, где лежат эти файлы>).
stages:
  - test
  - release

phpunit:
  stage: test
  image: php:8.2-cli
  services:
    - name: mariadb:10.11
      alias: mariadb
  variables:
    MARIADB_ROOT_PASSWORD: root
    MARIADB_DATABASE: docportal_test
    MARIADB_USER: docportal
    MARIADB_PASSWORD: docportal
    APP_ENV: test
    DATABASE_URL: "mysql://docportal:docportal@mariadb:3306/docportal?serverVersion=10.11.14-MariaDB&charset=utf8mb4"
  before_script:
    - apt-get update -q && apt-get install -y -q --no-install-recommends git unzip poppler-utils fonts-dejavu-core mariadb-client
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions && install-php-extensions intl pdo_mysql zip gd ldap @composer
    - composer install --no-interaction --no-progress --prefer-dist
    # Ожидание базы данных (служба запускается параллельно с заданием).
    - for i in $(seq 1 30); do mariadb-admin ping -h mariadb -udocportal -pdocportal --silent && break; sleep 2; done
  script:
    - php bin/console lint:container
    - php bin/console lint:twig templates
    - php bin/console lint:yaml config translations --parse-tags
    - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    - php bin/console doctrine:schema:validate
    - rm -rf var/cache/test
    - vendor/bin/phpunit

# То же на MySQL 8.4 (режим Docker портала работает на MySQL).
phpunit-mysql:
  extends: phpunit
  services:
    - name: mysql:8.4
      alias: mariadb
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: docportal_test
    MYSQL_USER: docportal
    MYSQL_PASSWORD: docportal
    DATABASE_URL: "mysql://docportal:docportal@mariadb:3306/docportal?serverVersion=8.4.0&charset=utf8mb4"

# Самая новая версия PHP: сборка падает и от устаревших вызовов (deprecations) — подготовка к Symfony 8
# (РУКОВОДСТВО, 8.4).
phpunit-php85:
  extends: phpunit
  image: php:8.5-cli
  script:
    - php bin/console lint:container
    - php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    - rm -rf var/cache/test
    - vendor/bin/phpunit --fail-on-deprecation

# Проба Symfony 8: зависимости обновляются до Symfony 8, DoctrineBundle 3 и MonologBundle 4, автотесты (SQLite)
# должны пройти без устаревших вызовов. Сигнал «к переходу готовы», сборку не останавливает.
symfony-next:
  stage: test
  image: php:8.5-cli
  allow_failure: true
  variables:
    APP_ENV: test
    DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
  before_script:
    - apt-get update -q && apt-get install -y -q --no-install-recommends git unzip poppler-utils fonts-dejavu-core
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions && install-php-extensions intl pdo_mysql zip gd ldap @composer
  script:
    - bash scripts/symfony-next.sh 8.1
    - php bin/console lint:container
    - php bin/console lint:twig templates
    - rm -rf var/cache/test
    - vendor/bin/phpunit --fail-on-deprecation

# Известные уязвимости: Composer — все пакеты, npm — зависимости сервера высокой и критической важности.
audit:
  stage: test
  image: php:8.4-cli
  before_script:
    - apt-get update -q && apt-get install -y -q --no-install-recommends git unzip curl ca-certificates nodejs npm
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions && install-php-extensions @composer
  script:
    - composer audit --locked --no-interaction --format=plain --abandoned=report
    - (cd video/server && npm audit --package-lock-only --omit=dev --audit-level=high)
    - (cd video/web && npm audit --package-lock-only --omit=dev --audit-level=high)

video:
  stage: test
  image: node:22-bookworm-slim
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: corpvideo
    POSTGRES_PASSWORD: corpvideo
    POSTGRES_DB: corpvideo_test
    TEST_DATABASE_URL: postgres://corpvideo:corpvideo@postgres:5432/corpvideo_test
  script:
    - cd video/server && npm ci --no-audit --no-fund
    - for f in $(find src -name '*.js'); do node --check "$f"; done
    - npm run test:portal
    - cd ../web && npm ci --no-audit --no-fund
    - VITE_BASE=/video/ npm run build

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -x -S warning -e SC2034 deploy/*.sh docker/entrypoint.sh scripts/*.sh
    - shellcheck -S warning video/deploy/docker/entrypoint.sh

release:
  stage: release
  image: php:8.4-cli
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  before_script:
    - apt-get update -q && apt-get install -y -q --no-install-recommends git unzip rsync curl ca-certificates
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions && install-php-extensions intl pdo_mysql zip gd ldap @composer
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y -q nodejs
  script:
    - '[ "${CI_COMMIT_TAG#v}" = "$(tr -d " \n\r" < VERSION)" ] || { echo "Тег ${CI_COMMIT_TAG} не совпадает с VERSION"; exit 1; }'
    - composer install --no-interaction --no-progress --prefer-dist
    - ./scripts/build-release.sh
    - cd dist && sha256sum -c docportal-*.tar.gz.sha256
  artifacts:
    name: "docportal-$CI_COMMIT_TAG"
    paths:
      - dist/docportal-*.tar.gz
      - dist/docportal-*.tar.gz.sha256
      - dist/latest.txt
    expire_in: 1 year

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0F4382">
    <title>Нет связи с порталом</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F8FB; color: #1D1E1E; font: 16px/1.5 Roboto, Arial, Helvetica, sans-serif; }
        main { max-width: 420px; padding: 32px 24px; text-align: center; }
        img { width: 72px; height: auto; }
        h1 { font-size: 22px; margin: 16px 0 8px; color: #0F4382; }
        p { margin: 0 0 20px; color: #4B5563; }
        button { font: inherit; padding: 10px 22px; border: 0; border-radius: 999px; background: #0F4382; color: #fff; cursor: pointer; }
        button:focus-visible { outline: 3px solid #79A7C6; outline-offset: 2px; }
    </style>
</head>
<body>
<main>
    <img src="/img/favicon.svg" alt="">
    <h1>Нет связи с порталом</h1>
    <p>Проверьте подключение к сети (портал может быть доступен только из сети компании) и повторите попытку.</p>
    <button type="button" onclick="location.reload()">Повторить</button>
</main>
</body>
</html>

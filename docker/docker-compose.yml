# =============================================================================
#  Docker Compose для портала документации.
#  Запуск:  cd docker && cp .env.example .env && (отредактируйте .env) && docker compose up -d --build
#  Переменные берутся из файла docker/.env (создаётся скриптом deploy/install.sh --mode docker).
#  Раздел «Видео» (видеопортал по адресу /video) — профили «video» и «video-live»: docportal video enable.
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-docportal}

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=64M
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Задайте MYSQL_ROOT_PASSWORD в docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docportal}
      MYSQL_USER: ${MYSQL_USER:-docportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Задайте MYSQL_PASSWORD в docker/.env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.4-fpm-alpine}
        TZ: ${TZ:-Europe/Moscow}
        WITH_PREVIEW: ${WITH_PREVIEW:-0}
        WITH_OCR: ${WITH_OCR:-0}
    image: ${APP_IMAGE:-docportal:latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-docportal}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-docportal}?serverVersion=8.0.0&charset=utf8mb4"
      STORAGE_DIR: /var/www/html/var/storage
      IMPORT_DIR: /var/www/html/var/import
    volumes:
      - storage:/var/www/html/var/storage
      - logs:/var/www/html/var/log
      # Каталог импорта: том Docker (по умолчанию) или каталог на сервере — см. IMPORT_HOST_DIR в docker/.env.
      - ${IMPORT_HOST_DIR:-import}:/var/www/html/var/import
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Планировщик: проверка сроков актуальности, описания через LLM, индексация содержимого, напоминания
  # об ознакомлении и по таблицам материалов, разбор сообщений бота Telegram (см. docker/entrypoint.sh).
  # На сервере эти задания не нужны.
  cron:
    image: ${APP_IMAGE:-docportal:latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-docportal}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-docportal}?serverVersion=8.0.0&charset=utf8mb4"
      STORAGE_DIR: /var/www/html/var/storage
      IMPORT_DIR: /var/www/html/var/import
      EXPIRY_CRON: ${EXPIRY_CRON:-0 8 * * *}
      DESCRIBE_CRON: ${DESCRIBE_CRON:-20 * * * *}
      REINDEX_CRON: ${REINDEX_CRON:-40 * * * *}
      ACKNOWLEDGE_CRON: ${ACKNOWLEDGE_CRON:-30 8 * * *}
      TELEGRAM_CRON: ${TELEGRAM_CRON:-* * * * *}
      MATERIALS_REMIND_CRON: ${MATERIALS_REMIND_CRON:-10 9 * * 1}
      TEAM_DIGEST_CRON: ${TEAM_DIGEST_CRON:-40 8 * * 1}
      STATS_CRON: ${STATS_CRON:-5 0 * * *}
    command: ["cron"]
    volumes:
      - storage:/var/www/html/var/storage
      - logs:/var/www/html/var/log
      - ${IMPORT_HOST_DIR:-import}:/var/www/html/var/import
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Каталог целиком (а не файл): изменённая обновлением конфигурация видна контейнеру после nginx -s reload.
      - ./nginx:/etc/nginx/conf.d:ro
      - ../public:/var/www/html/public:ro
      # Режим обслуживания: флаг, страница и список разрешённых адресов (docportal maintenance on|off).
      - ../maintenance:/var/www/maintenance:ro
      # Раздел «Видео»: медиафайлы отдаёт nginx после проверки прав в API видеопортала (только чтение).
      - video-media:/var/lib/docportal-video/media:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # --- Раздел «Видео» -----------------------------------------------------------------------------------
  # Видеопортал по адресу /video (вход и роли — общие с порталом). Контейнеры включаются профилями:
  # «video» — база, API и обработка видео; «video-live» — сервер прямых трансляций (MediaMTX).
  # Включение: docportal video enable (добавляет профили в COMPOSE_PROFILES файла docker/.env).
  video-db:
    image: ${VIDEO_POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["video"]
    environment:
      POSTGRES_USER: corpvideo
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD:-}
      POSTGRES_DB: corpvideo
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - video-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpvideo -d corpvideo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # API видеопортала. Секреты портала (docker/.env) сюда не передаются — только переменные VIDEO_*.
  video-api:
    build:
      context: ../video
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${VIDEO_NODE_IMAGE:-node:22-bookworm-slim}
        VITE_BASE: ${VIDEO_BASE_PATH:-/video}/
        TZ: ${TZ:-Europe/Moscow}
    image: ${VIDEO_IMAGE:-docportal-video:latest}
    profiles: ["video"]
    command: ["node", "server/src/index.js"]
    environment: &video-env
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_PATH: ${VIDEO_BASE_PATH:-/video}
      BASE_URL: ${VIDEO_BASE_URL:-http://localhost/video}
      SECRET_KEY: ${VIDEO_SECRET_KEY:-}
      DATABASE_URL: "postgres://corpvideo:${VIDEO_DB_PASSWORD:-}@video-db:5432/corpvideo"
      DATA_DIR: /data
      WEB_DIST: /app/web/dist
      NGINX_ACCEL: "1"
      TRUST_PROXY: "1"
      TZ: ${TZ:-Europe/Moscow}
      LOG_LEVEL: ${VIDEO_LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-2}
      # Общий вход: проверка сессии портала через внутренний сервер nginx контейнера web (порт 8079).
      PORTAL_INTERNAL_URL: http://web:8079
      PORTAL_SHARED_SECRET: ${VIDEO_SHARED_SECRET:-}
      PORTAL_NAME: ${APP_NAME:-Портал документации}
      # Трансляции
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      MEDIAMTX_PLAYBACK_URL: http://mediamtx:9996
      MEDIAMTX_HOOK_SECRET: ${VIDEO_HOOK_SECRET:-}
      LIVE_RTMP_URL: ${VIDEO_LIVE_RTMP_URL:-}
      LIVE_SRT_URL: ${VIDEO_LIVE_SRT_URL:-}
      LIVE_WHIP_URL: ${VIDEO_LIVE_WHIP_URL:-}
    volumes: &video-volumes
      - video-media:/data/media
      - video-uploads:/data/uploads
      - video-live:/data/live
      - video-import:/data/import
    depends_on:
      video-db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Обработка видео: перекодирование, субтитры, письма, импорт.
  video-worker:
    image: ${VIDEO_IMAGE:-docportal-video:latest}
    profiles: ["video"]
    command: ["node", "server/src/worker.js"]
    environment:
      <<: *video-env
      WORKER_ID: docker-worker
    volumes: *video-volumes
    healthcheck:
      disable: true
    depends_on:
      video-db:
        condition: service_healthy
      video-api:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Сервер прямых трансляций: RTMP (OBS), SRT, WebRTC (эфир из браузера). Записи эфиров — в томе video-live
  # от имени пользователя видеопортала (uid 1000).
  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.9.3}
    profiles: ["video-live"]
    user: "1000:1000"
    ports:
      - "1935:1935"
      - "8890:8890/udp"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - ./video/mediamtx.yml:/mediamtx.yml:ro
      - video-live:/data/live
    depends_on:
      - video-api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  db-data:
  storage:
  logs:
  import:
  video-db-data:
  video-media:
  video-uploads:
  video-live:
  video-import:

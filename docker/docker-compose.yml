# =============================================================================
#  Docker Compose для портала документации.
#  Запуск:  cd docker && cp .env.example .env && (отредактируйте .env) && docker compose up -d --build
#  Переменные берутся из файла docker/.env (создаётся скриптом deploy/install.sh --mode docker).
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-docportal}

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=64M
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Задайте MYSQL_ROOT_PASSWORD в docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docportal}
      MYSQL_USER: ${MYSQL_USER:-docportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Задайте MYSQL_PASSWORD в docker/.env}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.4-fpm-alpine}
        TZ: ${TZ:-Europe/Moscow}
    image: ${APP_IMAGE:-docportal:latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-docportal}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-docportal}?serverVersion=8.0&charset=utf8mb4"
      STORAGE_DIR: /var/www/html/var/storage
      IMPORT_DIR: /var/www/html/var/import
    volumes:
      - storage:/var/www/html/var/storage
      - logs:/var/www/html/var/log
      # Каталог импорта: том Docker (по умолчанию) или каталог на сервере — см. IMPORT_HOST_DIR в docker/.env.
      - ${IMPORT_HOST_DIR:-import}:/var/www/html/var/import
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Планировщик: ежедневная проверка сроков актуальности (app:documents:expiry) и ежечасные описания через LLM (app:documents:describe).
  cron:
    image: ${APP_IMAGE:-docportal:latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-docportal}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-docportal}?serverVersion=8.0&charset=utf8mb4"
      STORAGE_DIR: /var/www/html/var/storage
      IMPORT_DIR: /var/www/html/var/import
      EXPIRY_CRON: ${EXPIRY_CRON:-0 8 * * *}
      DESCRIBE_CRON: ${DESCRIBE_CRON:-20 * * * *}
      REINDEX_CRON: ${REINDEX_CRON:-40 * * * *}
      ACKNOWLEDGE_CRON: ${ACKNOWLEDGE_CRON:-30 8 * * *}
    command: ["cron"]
    volumes:
      - storage:/var/www/html/var/storage
      - logs:/var/www/html/var/log
      - ${IMPORT_HOST_DIR:-import}:/var/www/html/var/import
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  db-data:
  storage:
  logs:
  import:

# nginx для контейнера портала документации.
# Статика отдаётся из смонтированного каталога public/, PHP — через php-fpm контейнера app.

# Раздел «Видео» (видеопортал по адресу /video, docportal video enable): переменные для его правил.
map $http_upgrade $docportal_video_upgrade {
    default upgrade;
    ''      close;
}
map $uri $docportal_video_media_cache {
    ~*\.m3u8$            "no-cache";
    ~*\.(ts|m4s|mp4)$    "private, max-age=604800, immutable";
    default              "private, max-age=86400";
}

# Раздел «Видео»: проверка сессии портала для видеопортала (общий вход). Порт 8079 открыт только внутри
# сети Docker и не публикуется на сервере; запрос подписан общим секретом VIDEO_SHARED_SECRET.
server {
    listen 8079;
    server_name _;
    root /var/www/html/public;
    access_log off;
    server_tokens off;
    # Видеопортал сообщает, по какому протоколу открыт сайт: заново выданные cookie «Запомнить меня»
    # получают флаг Secure так же, как при обычном входе по HTTPS.
    set $docportal_video_https "";
    if ($http_x_forwarded_proto = "https") {
        set $docportal_video_https on;
    }
    location = /internal/video/session {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $docportal_video_https;
        fastcgi_read_timeout 30;
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Режим обслуживания (docportal maintenance on|off, update.sh на время миграций): каталог
    # ${APP_DIR}/maintenance сервера подключён сюда как /var/www/maintenance. Пока в нём есть файл enabled,
    # посетители видят страницу «Идёт обновление портала» (503), а /health, /health/details и /metrics
    # отвечают как обычно — по ним скрипты обновления проверяют новую версию.
    set $docportal_maintenance 0;
    if (-f /var/www/maintenance/enabled) {
        set $docportal_maintenance 1;
    }
    # Адреса, которым портал доступен во время обслуживания (docportal maintenance on --allow …).
    include /var/www/maintenance/allow*.conf;
    # Сверяется исходный адрес запроса: после внутреннего перехода на /index.php правила проверяются заново.
    if ($request_uri ~ "^/(health|health/details|metrics)(\?|$)") {
        set $docportal_maintenance 0;
    }
    if ($uri = /docportal-maintenance.html) {
        set $docportal_maintenance 0;
    }
    if ($docportal_maintenance) {
        return 503;
    }
    # Внутренний адрес страницы (а не именованный location): запрос любого метода, в том числе отправка
    # формы, получает страницу, а не ошибку 405.
    # Нет файла страницы — стандартный ответ 503 nginx (а не 404).
    error_page 503 /docportal-maintenance.html;
    location = /docportal-maintenance.html {
        internal;
        root /var/www/maintenance;
        try_files /index.html =503;
        default_type text/html;
        charset utf-8;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Раздел «Видео»: правила создаёт docportal video enable (файл docker/nginx/video/portal.locations);
    # раздел выключен — файла нет, и адрес /video обслуживает портал (страница «не найдено»).
    include /etc/nginx/conf.d/video/*.locations;

    client_max_body_size 128M;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 180;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Без add_header внутри location: иначе nginx не отправляет заголовки безопасности уровня server.
    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F4382"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D00024"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F8F4E"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7480"/></marker></defs>
<rect width="1100" height="440" fill="#FFFFFF"/>
<text x="24" y="34" font-family="'DIN Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F4382" letter-spacing="0.5">СХЕМА РАЗВЁРТЫВАНИЯ В DOCKER COMPOSE</text>
<rect x="40" y="100" width="160" height="70" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="120.0" y="124" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Браузер</text>
<text x="120.0" y="144" text-anchor="middle" font-size="13" fill="#1D1E1E">порт HTTP_PORT</text>
<text x="120.0" y="162" text-anchor="middle" font-size="13" fill="#1D1E1E">(по умолчанию 80)</text>
<rect x="240" y="60" width="820" height="340" rx="18" fill="#F4F8FB" stroke="#DFDEDE"/>
<text x="256" y="82" font-size="12" font-weight="700" fill="#79A7C6" letter-spacing="1.5">DOCKER COMPOSE (КАТАЛОГ DOCKER/)</text>
<rect x="270" y="100" width="190" height="90" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="365.0" y="124" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">web</text>
<text x="365.0" y="144" text-anchor="middle" font-size="13" fill="#1D1E1E">nginx:1.27-alpine</text>
<text x="365.0" y="162" text-anchor="middle" font-size="13" fill="#1D1E1E">public/ (только чтение)</text>
<text x="365.0" y="180" text-anchor="middle" font-size="13" fill="#1D1E1E">проксирует PHP в app:9000</text>
<rect x="490" y="100" width="190" height="90" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="585.0" y="124" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">app</text>
<text x="585.0" y="144" text-anchor="middle" font-size="13" fill="#1D1E1E">php:8.4-fpm-alpine</text>
<text x="585.0" y="162" text-anchor="middle" font-size="13" fill="#1D1E1E">код портала + vendor</text>
<text x="585.0" y="180" text-anchor="middle" font-size="13" fill="#1D1E1E">entrypoint: миграции, админ</text>
<rect x="710" y="100" width="150" height="90" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="785.0" y="124" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">db</text>
<text x="785.0" y="144" text-anchor="middle" font-size="13" fill="#1D1E1E">mysql:8.0</text>
<text x="785.0" y="162" text-anchor="middle" font-size="13" fill="#1D1E1E">utf8mb4</text>
<text x="785.0" y="180" text-anchor="middle" font-size="13" fill="#1D1E1E">healthcheck</text>
<rect x="890" y="100" width="150" height="90" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="965.0" y="124" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">cron</text>
<text x="965.0" y="144" text-anchor="middle" font-size="13" fill="#1D1E1E">тот же образ</text>
<text x="965.0" y="162" text-anchor="middle" font-size="13" fill="#1D1E1E">crond: проверка</text>
<text x="965.0" y="180" text-anchor="middle" font-size="13" fill="#1D1E1E">сроков 08:00</text>
<rect x="490" y="250" width="190" height="70" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="585.0" y="274" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">том storage</text>
<text x="585.0" y="294" text-anchor="middle" font-size="13" fill="#1D1E1E">/var/www/html/var/storage</text>
<rect x="710" y="250" width="150" height="70" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="785.0" y="274" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">том db-data</text>
<text x="785.0" y="294" text-anchor="middle" font-size="13" fill="#1D1E1E">/var/lib/mysql</text>
<rect x="270" y="250" width="190" height="70" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="365.0" y="274" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">том logs</text>
<text x="365.0" y="294" text-anchor="middle" font-size="13" fill="#1D1E1E">/var/www/html/var/log</text>
<line x1="200" y1="135" x2="270" y2="135" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460" y1="145" x2="490" y2="145" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="475.0" y="139.0" text-anchor="middle" font-size="12" fill="#0F4382">FastCGI</text>
<line x1="680" y1="145" x2="710" y2="145" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="139.0" text-anchor="middle" font-size="12" fill="#0F4382">SQL</text>
<line x1="585" y1="190" x2="585" y2="250" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="785" y1="190" x2="785" y2="250" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="180" x2="400" y2="250" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<line x1="890" y1="160" x2="860" y2="160" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="40" y="350" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">Настройки — docker/.env (пароли БД, APP_SECRET, ADMIN_USER/ADMIN_PASSWORD, порты, образы, LDAP, почта, расписание EXPIRY_CRON).</text>
<text x="40" y="370" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">Если Docker Hub недоступен, укажите зеркало: --docker-mirror https://mirror.gcr.io или образы из другого реестра в .env.</text>
</svg>
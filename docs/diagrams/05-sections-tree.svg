<rect width="1160" height="560" fill="#FFFFFF"/>
<text x="24" y="34" font-family="'DIN Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F4382" letter-spacing="0.5">ДЕРЕВО РАЗДЕЛОВ И НАСЛЕДОВАНИЕ ПРАВ МОДЕРАТОРОВ</text>
<rect x="60" y="80" width="220" height="66" rx="12" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="170.0" y="104" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Общие документы</text>
<text x="170.0" y="124" text-anchor="middle" font-size="11" fill="#1D1E1E">модератор: Иванов</text>
<rect x="60" y="180" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="160.0" y="204" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Регламенты и политики</text>
<text x="160.0" y="224" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Иванова)</text>
<rect x="60" y="280" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="160.0" y="304" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Информационная безопасность</text>
<text x="160.0" y="324" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Иванова)</text>
<rect x="320" y="180" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="420.0" y="204" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Инструкции</text>
<text x="420.0" y="224" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Иванова)</text>
<rect x="320" y="280" width="200" height="66" rx="12" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="420.0" y="304" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">ИТ</text>
<text x="420.0" y="324" text-anchor="middle" font-size="11" fill="#1D1E1E">модератор: Петрова</text>
<text x="420.0" y="342" text-anchor="middle" font-size="11" fill="#1D1E1E">(и права Иванова)</text>
<rect x="320" y="380" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="420.0" y="404" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Рабочее место</text>
<text x="420.0" y="424" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Петровой и Иванова)</text>
<rect x="560" y="380" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="660.0" y="404" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Почта и телефония</text>
<text x="660.0" y="424" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Петровой и Иванова)</text>
<rect x="560" y="280" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="660.0" y="304" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Охрана труда</text>
<text x="660.0" y="324" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Иванова)</text>
<rect x="840" y="80" width="220" height="66" rx="12" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="950.0" y="104" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Производство</text>
<text x="950.0" y="124" text-anchor="middle" font-size="11" fill="#1D1E1E">модератор: Сидоров</text>
<rect x="840" y="180" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="940.0" y="204" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Технологические карты</text>
<text x="940.0" y="224" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Сидорова)</text>
<rect x="840" y="280" width="200" height="66" rx="12" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="940.0" y="304" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Чертежи и схемы</text>
<text x="940.0" y="324" text-anchor="middle" font-size="11" fill="#1D1E1E">(права Сидорова)</text>

<line x1="160" y1="246" x2="160" y2="280" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<line x1="280" y1="113" x2="420" y2="180" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>

<line x1="420" y1="346" x2="420" y2="380" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<line x1="520" y1="320" x2="660" y2="380" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<line x1="520" y1="213" x2="660" y2="280" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<line x1="950" y1="146" x2="940" y2="180" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<line x1="940" y1="246" x2="940" y2="280" stroke="#79A7C6" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<text x="60" y="490" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">Модератор раздела автоматически управляет всеми его подразделами любой глубины (максимум — 10 уровней).</text>
<text x="60" y="510" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">Модератор «ИТ» (Петрова) не имеет прав на «Охрану труда» и «Регламенты» — они выше или в соседней ветке дерева.</text>
<text x="60" y="530" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">При переносе раздела в другое место дерева права пересчитываются автоматически по новому положению.</text>
</svg>
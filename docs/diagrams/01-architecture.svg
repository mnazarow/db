<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F4382"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D00024"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F8F4E"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7480"/></marker></defs>
<rect width="1160" height="600" fill="#FFFFFF"/>
<text x="24" y="34" font-family="'DIN Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F4382" letter-spacing="0.5">АРХИТЕКТУРА ПОРТАЛА</text>
<rect x="24" y="60" width="250" height="470" rx="18" fill="#F4F8FB" stroke="#DFDEDE"/>
<text x="40" y="82" font-size="12" font-weight="700" fill="#79A7C6" letter-spacing="1.5">ЛЮДИ</text>
<rect x="50" y="110" width="200" height="78" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="150.0" y="134" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Сотрудники</text>
<text x="150.0" y="154" text-anchor="middle" font-size="13" fill="#1D1E1E">читают и скачивают</text>
<text x="150.0" y="172" text-anchor="middle" font-size="13" fill="#1D1E1E">опубликованные документы</text>
<rect x="50" y="214" width="200" height="78" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="150.0" y="238" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Модераторы разделов</text>
<text x="150.0" y="258" text-anchor="middle" font-size="13" fill="#1D1E1E">создают документы,</text>
<text x="150.0" y="276" text-anchor="middle" font-size="13" fill="#1D1E1E">версии, публикуют</text>
<rect x="50" y="318" width="200" height="78" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="150.0" y="342" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Администраторы</text>
<text x="150.0" y="362" text-anchor="middle" font-size="13" fill="#1D1E1E">разделы, модераторы,</text>
<text x="150.0" y="380" text-anchor="middle" font-size="13" fill="#1D1E1E">пользователи, статистика</text>
<rect x="50" y="422" width="200" height="88" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="150.0" y="446" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Консоль сервера</text>
<text x="150.0" y="466" text-anchor="middle" font-size="13" fill="#1D1E1E">docportal …</text>
<text x="150.0" y="484" text-anchor="middle" font-size="13" fill="#1D1E1E">php bin/console …</text>
<text x="150.0" y="502" text-anchor="middle" font-size="13" fill="#1D1E1E">скрипты deploy/*.sh</text>
<rect x="310" y="60" width="560" height="470" rx="18" fill="#F4F8FB" stroke="#DFDEDE"/>
<text x="326" y="82" font-size="12" font-weight="700" fill="#79A7C6" letter-spacing="1.5">СЕРВЕР ПРИЛОЖЕНИЯ (NGINX + PHP-FPM ИЛИ DOCKER)</text>
<rect x="340" y="110" width="230" height="70" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="455.0" y="134" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">nginx</text>
<text x="455.0" y="154" text-anchor="middle" font-size="13" fill="#1D1E1E">статика public/</text>
<text x="455.0" y="172" text-anchor="middle" font-size="13" fill="#1D1E1E">HTTPS, лимит 128 МБ</text>
<rect x="610" y="110" width="230" height="70" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="725.0" y="134" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">PHP-FPM 8.2+</text>
<text x="725.0" y="154" text-anchor="middle" font-size="13" fill="#1D1E1E">php-fpm пул www</text>
<text x="725.0" y="172" text-anchor="middle" font-size="13" fill="#1D1E1E">opcache, ext-ldap</text>
<rect x="340" y="220" width="500" height="290" rx="14" fill="#FFFFFF" stroke="#79A7C6" stroke-width="1.5"/>
<text x="590.0" y="244" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Приложение Symfony 7.4</text>
<rect x="360" y="258" width="150" height="70" rx="14" fill="#E7EFF6" stroke="#79A7C6" stroke-width="1.5"/>
<text x="435.0" y="282" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Security</text>
<text x="435.0" y="302" text-anchor="middle" font-size="11" fill="#1D1E1E">вход: локальный /</text>
<text x="435.0" y="320" text-anchor="middle" font-size="11" fill="#1D1E1E">LDAP, роли, voter</text>
<rect x="525" y="258" width="150" height="70" rx="14" fill="#E7EFF6" stroke="#79A7C6" stroke-width="1.5"/>
<text x="600.0" y="282" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Разделы</text>
<text x="600.0" y="302" text-anchor="middle" font-size="11" fill="#1D1E1E">дерево любой глубины,</text>
<text x="600.0" y="320" text-anchor="middle" font-size="11" fill="#1D1E1E">модераторы, наследование</text>
<rect x="690" y="258" width="135" height="70" rx="14" fill="#E7EFF6" stroke="#79A7C6" stroke-width="1.5"/>
<text x="757.5" y="282" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Документы</text>
<text x="757.5" y="302" text-anchor="middle" font-size="11" fill="#1D1E1E">файлы и страницы,</text>
<text x="757.5" y="320" text-anchor="middle" font-size="11" fill="#1D1E1E">версии, статусы</text>
<rect x="360" y="344" width="150" height="70" rx="14" fill="#E7EFF6" stroke="#79A7C6" stroke-width="1.5"/>
<text x="435.0" y="368" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Актуальность</text>
<text x="435.0" y="388" text-anchor="middle" font-size="11" fill="#1D1E1E">сроки, уведомления</text>
<text x="435.0" y="406" text-anchor="middle" font-size="11" fill="#1D1E1E">по cron (Mailer)</text>
<rect x="525" y="344" width="150" height="70" rx="14" fill="#E7EFF6" stroke="#79A7C6" stroke-width="1.5"/>
<text x="600.0" y="368" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Статистика</text>
<text x="600.0" y="388" text-anchor="middle" font-size="11" fill="#1D1E1E">события: просмотры,</text>
<text x="600.0" y="406" text-anchor="middle" font-size="11" fill="#1D1E1E">скачивания, версии</text>
<rect x="690" y="344" width="135" height="70" rx="14" fill="#E7EFF6" stroke="#79A7C6" stroke-width="1.5"/>
<text x="757.5" y="368" text-anchor="middle" font-weight="700" font-size="13" fill="#0F4382">Twig + CSS</text>
<text x="757.5" y="388" text-anchor="middle" font-size="11" fill="#1D1E1E">стиль vodokomfort.ru,</text>
<text x="757.5" y="406" text-anchor="middle" font-size="11" fill="#1D1E1E">редактор Quill</text>
<text x="590" y="450" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">Doctrine ORM, миграции, консольные команды app:*</text>
<text x="590" y="470" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">Журналы: var/log/prod.log (ошибки), var/log/audit.log (действия пользователей)</text>
<rect x="900" y="60" width="236" height="470" rx="18" fill="#F4F8FB" stroke="#DFDEDE"/>
<text x="916" y="82" font-size="12" font-weight="700" fill="#79A7C6" letter-spacing="1.5">ХРАНИЛИЩА И СЛУЖБЫ</text>

<text x="1018.0" y="144" text-anchor="middle" font-size="13" fill="#1D1E1E">user, section, document,</text>
<text x="1018.0" y="162" text-anchor="middle" font-size="13" fill="#1D1E1E">document_version,</text>
<text x="1018.0" y="180" text-anchor="middle" font-size="13" fill="#1D1E1E">document_event</text>
<rect x="922" y="204" width="192" height="74" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="1018.0" y="228" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Хранилище файлов</text>
<text x="1018.0" y="248" text-anchor="middle" font-size="13" fill="#1D1E1E">var/storage (native:</text>
<text x="1018.0" y="266" text-anchor="middle" font-size="13" fill="#1D1E1E">shared/storage; docker: том)</text>
<rect x="922" y="298" width="192" height="66" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="1018.0" y="322" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Active Directory</text>
<text x="1018.0" y="342" text-anchor="middle" font-size="13" fill="#1D1E1E">LDAP 389/636:</text>
<text x="1018.0" y="360" text-anchor="middle" font-size="13" fill="#1D1E1E">проверка паролей</text>
<rect x="922" y="384" width="192" height="60" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="1018.0" y="408" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">SMTP-сервер</text>
<text x="1018.0" y="428" text-anchor="middle" font-size="13" fill="#1D1E1E">уведомления о сроках</text>
<rect x="922" y="464" width="192" height="56" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="1018.0" y="488" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">Резервные копии</text>
<text x="1018.0" y="508" text-anchor="middle" font-size="13" fill="#1D1E1E">/var/backups/docportal</text>

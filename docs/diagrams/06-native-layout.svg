<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F4382"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D00024"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F8F4E"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7480"/></marker></defs>
<rect width="1100" height="620" fill="#FFFFFF"/>
<text x="24" y="34" font-family="'DIN Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F4382" letter-spacing="0.5">РАЗМЕЩЕНИЕ НА СЕРВЕРЕ (РЕЖИМ NATIVE)</text>
<text x="40" y="70" font-size="12.5" fill="#0F4382" text-anchor="start" font-weight="700" xml:space="preserve">▸ /opt/docportal/</text>
<text x="68" y="96" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  current  →  releases/1.0.0-20260915…/   (символическая ссылка на рабочий релиз)</text>
<text x="68" y="122" font-size="12.5" fill="#0F4382" text-anchor="start" font-weight="700" xml:space="preserve">▸ releases/</text>
<text x="96" y="148" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  1.0.0-20260915120000/   код версии: bin/, config/, public/, src/, templates/, vendor/</text>
<text x="96" y="174" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  0.9.0-…/   предыдущий релиз (для отката, хранится 3 последних)</text>
<text x="68" y="200" font-size="12.5" fill="#0F4382" text-anchor="start" font-weight="700" xml:space="preserve">▸ shared/</text>
<text x="96" y="226" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  .env.local   настройки (секрет, база данных, почта, LDAP)</text>
<text x="96" y="252" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  storage/   файлы всех версий документов (по каталогу на документ)</text>
<text x="96" y="278" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  log/   prod.log, audit.log, expiry-cron.log</text>
<text x="40" y="304" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /etc/docportal/install.conf   параметры установки (для update/backup/uninstall)</text>
<text x="40" y="330" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /etc/docportal/admin-credentials.txt   первый пароль администратора (удалить!)</text>
<text x="40" y="356" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /etc/nginx/sites-available/docportal.conf   виртуальный хост</text>
<text x="40" y="382" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /etc/php/8.x/fpm/conf.d/90-docportal.ini   лимиты PHP</text>
<text x="40" y="408" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /etc/cron.d/docportal   проверка сроков 08:00, резервная копия 03:15</text>
<text x="40" y="434" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /usr/local/bin/docportal   команда управления</text>
<text x="40" y="460" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /var/backups/docportal/   архивы резервных копий</text>
<text x="40" y="486" font-size="12.5" fill="#1D1E1E" text-anchor="start" font-weight="normal" xml:space="preserve">  /var/log/docportal/   журналы скриптов установки и обновления</text>
<rect x="760" y="462" width="300" height="74" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="910.0" y="486" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">/usr/local/bin/docportal</text>
<text x="910.0" y="506" text-anchor="middle" font-size="13" fill="#1D1E1E">status | update | backup | restore |</text>
<text x="910.0" y="524" text-anchor="middle" font-size="13" fill="#1D1E1E">console | logs | uninstall</text>
<text x="40" y="580" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">Обновление создаёт новый каталог в releases/ и переключает ссылку current; при ошибке ссылка возвращается на прежний релиз.</text>
<text x="40" y="600" font-size="12" fill="#6E7480" text-anchor="start" font-weight="normal" xml:space="preserve">Пользователь службы (www-data) владеет только shared/ и var/; код релизов доступен ему только для чтения.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F4382"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D00024"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F8F4E"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7480"/></marker></defs>
<rect width="1160" height="520" fill="#FFFFFF"/>
<text x="24" y="34" font-family="'DIN Condensed', 'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F4382" letter-spacing="0.5">ЖИЗНЕННЫЙ ЦИКЛ ДОКУМЕНТА И ВЕРСИИ</text>
<rect x="30" y="60" width="1100" height="200" rx="18" fill="#F4F8FB" stroke="#DFDEDE"/>
<text x="46" y="82" font-size="12" font-weight="700" fill="#79A7C6" letter-spacing="1.5">СТАТУСЫ ДОКУМЕНТА</text>
<rect x="70" y="130" width="150" height="26" rx="13" fill="#ECEAFB" stroke="#5B4FCF"/>
<circle cx="84" cy="143" r="4" fill="#5B4FCF"/>
<text x="96" y="147" font-size="12" fill="#1D1E1E">Черновик</text>
<rect x="420" y="130" width="170" height="26" rx="13" fill="#E6F5EC" stroke="#1F8F4E"/>
<circle cx="434" cy="143" r="4" fill="#1F8F4E"/>
<text x="446" y="147" font-size="12" fill="#1D1E1E">Опубликован</text>
<rect x="800" y="130" width="150" height="26" rx="13" fill="#F6F6F6" stroke="#6E7480"/>
<circle cx="814" cy="143" r="4" fill="#6E7480"/>
<text x="826" y="147" font-size="12" fill="#1D1E1E">В архиве</text>
<line x1="220" y1="143" x2="420" y2="143" stroke="#1F8F4E" stroke-width="1.8" marker-end="url(#arrow-green)"/>
<text x="320.0" y="137.0" text-anchor="middle" font-size="12" fill="#1F8F4E">Опубликовать</text>
<path d="M 420 155 C 350 200, 290 200, 220 155" fill="none" stroke="#6E7480" stroke-width="1.8" marker-end="url(#arrow-muted)" stroke-dasharray="6 4"/>
<text x="320" y="205" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">Снять с публикации</text>
<line x1="590" y1="143" x2="800" y2="143" stroke="#6E7480" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
<text x="695.0" y="137.0" text-anchor="middle" font-size="12" fill="#6E7480">В архив</text>
<path d="M 800 155 C 740 215, 300 235, 220 158" fill="none" stroke="#6E7480" stroke-width="1.8" marker-end="url(#arrow-muted)" stroke-dasharray="6 4"/>
<text x="520" y="236" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">Опубликовать снова / снять с публикации (из архива)</text>
<text x="145" y="100" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">видят модераторы</text>
<text x="505" y="100" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">видят все сотрудники</text>
<text x="875" y="100" font-size="11" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">снят с публикации, история сохранена</text>
<rect x="30" y="290" width="1100" height="200" rx="18" fill="#F4F8FB" stroke="#DFDEDE"/>
<text x="46" y="312" font-size="12" font-weight="700" fill="#79A7C6" letter-spacing="1.5">ВЕРСИИ (НИКОГДА НЕ ИЗМЕНЯЮТСЯ И НЕ УДАЛЯЮТСЯ)</text>
<rect x="60" y="340" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="155.0" y="364" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">v1</text>
<text x="155.0" y="384" text-anchor="middle" font-size="13" fill="#1D1E1E">первая версия:</text>
<text x="155.0" y="402" text-anchor="middle" font-size="13" fill="#1D1E1E">файл или текст</text>
<text x="155.0" y="420" text-anchor="middle" font-size="13" fill="#1D1E1E">страницы</text>
<rect x="300" y="340" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="395.0" y="364" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">v2</text>
<text x="395.0" y="384" text-anchor="middle" font-size="13" fill="#1D1E1E">новая версия:</text>
<text x="395.0" y="402" text-anchor="middle" font-size="13" fill="#1D1E1E">загрузка файла /</text>
<text x="395.0" y="420" text-anchor="middle" font-size="13" fill="#1D1E1E">сохранение текста</text>
<rect x="540" y="340" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#0F4382" stroke-width="1.5"/>
<text x="635.0" y="364" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">v3</text>
<text x="635.0" y="384" text-anchor="middle" font-size="13" fill="#1D1E1E">ещё одна</text>
<text x="635.0" y="402" text-anchor="middle" font-size="13" fill="#1D1E1E">правка</text>
<rect x="780" y="340" width="220" height="100" rx="14" fill="#E7EFF6" stroke="#0F4382" stroke-width="1.5"/>
<text x="890.0" y="364" text-anchor="middle" font-weight="700" font-size="14" fill="#0F4382">v4 = копия v2</text>
<text x="890.0" y="384" text-anchor="middle" font-size="13" fill="#1D1E1E">«Восстановить» создаёт</text>
<text x="890.0" y="402" text-anchor="middle" font-size="13" fill="#1D1E1E">новую версию с содержимым</text>
<text x="890.0" y="420" text-anchor="middle" font-size="13" fill="#1D1E1E">выбранной старой</text>
<line x1="250" y1="390" x2="300" y2="390" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490" y1="390" x2="540" y2="390" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="730" y1="390" x2="780" y2="390" stroke="#0F4382" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 395 340 C 500 290, 800 290, 890 340" fill="none" stroke="#5B4FCF" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="640" y="318" font-size="11" fill="#5B4FCF" text-anchor="middle" font-weight="normal" xml:space="preserve">восстановление v2</text>
<text x="580" y="470" font-size="12" fill="#6E7480" text-anchor="middle" font-weight="normal" xml:space="preserve">Текущая версия — всегда последняя. Любую версию можно открыть/скачать, версии страниц — сравнить построчно; каждая версия хранит автора, дату и комментарий.</text>
</svg>
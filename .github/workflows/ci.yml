# Проверки портала на каждое изменение: синтаксис конфигурации и шаблонов, соответствие миграций
# схеме, автотесты PHPUnit на MariaDB, раздел «Видео» (тесты общего входа, сборка интерфейса)
# и проверка скриптов развёртывания shellcheck.
name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHPUnit и проверки Symfony (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: docportal_test
          MARIADB_USER: docportal
          MARIADB_PASSWORD: docportal
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: mysql://docportal:docportal@127.0.0.1:3306/docportal?serverVersion=10.11.14-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, zip, gd, ldap, mbstring, xml, curl, fileinfo
          tools: composer:v2
          coverage: none
      - name: Инструменты для проверок извлечения текста
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils fonts-dejavu-core
      - name: Зависимости
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Конфигурация, шаблоны, YAML
        run: |
          php bin/console lint:container
          php bin/console lint:twig templates
          php bin/console lint:yaml config translations --parse-tags
      - name: Миграции дают ту же схему, что и сущности
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console doctrine:schema:validate
      - name: Автотесты
        run: |
          rm -rf var/cache/test
          vendor/bin/phpunit

  video:
    name: Раздел «Видео» (Node.js)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Сервер видеопортала — модульные тесты общего входа
        working-directory: video/server
        run: |
          npm ci --no-audit --no-fund
          for f in $(find src -name '*.js'); do node --check "$f"; done
          npm run test:unit
      - name: Веб-интерфейс видеопортала — сборка для /video/
        working-directory: video/web
        run: |
          npm ci --no-audit --no-fund
          VITE_BASE=/video/ npm run build

  shell:
    name: Скрипты развёртывания (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -x -S warning -e SC2034 deploy/*.sh docker/entrypoint.sh scripts/*.sh
          shellcheck -S warning video/deploy/docker/entrypoint.sh
      - name: Синтаксис bash
        run: for f in deploy/*.sh docker/entrypoint.sh scripts/*.sh; do bash -n "$f"; done

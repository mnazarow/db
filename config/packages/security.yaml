security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|img|js|fonts|vendor)/
            security: false
        # REST API для внешних систем (индексатор RAG и т. п.): без сессий, по ключу API
        # (Authorization: Bearer dp_… или X-Api-Key: dp_…). Ключи создаются в панели администратора → Интеграции.
        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\Api\ApiAuthenticationEntryPoint
            access_token:
                token_handler: App\Security\Api\ApiKeyHandler
                failure_handler: App\Security\Api\ApiAuthenticationEntryPoint
                token_extractors:
                    - header
                    - app.api_key_header_extractor
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            # Единый аутентификатор: локальные учётные записи + Active Directory / LDAP.
            custom_authenticators:
                - App\Security\PortalAuthenticator
            entry_point: App\Security\PortalAuthenticator
            logout:
                path: app_logout
                target: app_login
                invalidate_session: true
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: '%env(int:REMEMBER_ME_LIFETIME)%'
                path: /
                secure: auto
                samesite: lax
                remember_me_parameter: _remember_me
            login_throttling:
                limiter: app.login_rate_limiter

    # Просмотр разделов и открытых документов доступен без входа (если это разрешено настройками портала —
    # см. App\Security\GuestAccessSubscriber); панель администратора, профиль и все действия с документами
    # и разделами требуют входа (проверяются voter'ом PortalVoter и атрибутами #[IsGranted]).
    # Всё под /api требует действующего ключа API.
    access_control:
        - { path: ^/api, roles: ROLE_API }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/documents/new, roles: ROLE_USER }
        - { path: ^/sections/new, roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
